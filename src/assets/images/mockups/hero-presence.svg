<svg width="150" height="148" viewBox="0 0 150 148" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- EK Tech warehouse app: attendance card (fictional data) -->
  <rect x="2.5" y="2.5" width="145" height="143" rx="17.5" stroke="white" stroke-opacity="0.1" stroke-width="5"/>
  <rect x="5" y="5" width="140" height="138" rx="15" fill="#0f1115" fill-opacity="0.72"/>
  <rect x="4.5" y="4.5" width="141" height="139" rx="15.5" stroke="white" stroke-opacity="0.2"/>
  <text x="75" y="27" text-anchor="middle" fill="#d4d4d8" font-size="11" font-weight="600">Presença - Hoje</text>
  <circle cx="75" cy="72" r="29" stroke="white" stroke-opacity="0.12" stroke-width="7"/>
  <!-- 18 of 20 present: 90% of the circumference (2πr ≈ 182.2) -->
  <circle cx="75" cy="72" r="29" stroke="#22c55e" stroke-width="7" stroke-linecap="round" stroke-dasharray="164 182.2" transform="rotate(-90 75 72)"/>
  <text x="75" y="80" text-anchor="middle" fill="white" font-size="22" font-weight="700">18</text>
  <text x="75" y="120" text-anchor="middle" fill="white" font-size="12" font-weight="600">Presentes</text>
  <text x="75" y="134" text-anchor="middle" fill="#a1a1aa" font-size="10">de 20 funcionários</text>
</svg>
