    <text x="44" y="46" fill="#111" font-size="13" font-weight="600">9:41</text>
    <rect x="132" y="27" width="87" height="24" rx="12" fill="#0f1115"/>
    <rect x="268" y="40" width="3" height="5" rx="1" fill="#111"/>
    <rect x="273" y="37.5" width="3" height="7.5" rx="1" fill="#111"/>
    <rect x="278" y="35" width="3" height="10" rx="1" fill="#111"/>
    <rect x="288" y="35" width="22" height="10.5" rx="3" stroke="#111" stroke-opacity="0.4" stroke-width="1.2"/>
    <rect x="290.5" y="37.5" width="12" height="5.5" rx="1.5" fill="#111"/>

    <!-- Menu and options -->
    <path d="M36 80h18M36 86.5h18M36 93h18" stroke="#3f3f46" stroke-width="2" stroke-linecap="round"/>
    <circle cx="298" cy="86.5" r="2" fill="#3f3f46"/>
    <circle cx="306" cy="86.5" r="2" fill="#3f3f46"/>
    <circle cx="314" cy="86.5" r="2" fill="#3f3f46"/>

    <text x="36" y="136" fill="#111" font-size="26" font-weight="700">Project plan</text>
    <text x="36" y="158" fill="#71717a" font-size="12.5">Delivery app · 8 weeks</text>

    <!-- Filters -->
    <rect x="36" y="174" width="279" height="40" rx="12" fill="#f4f4f5"/>
    <rect x="40" y="178" width="58" height="32" rx="9" fill="white" filter="url(#tab-shadow)"/>
    <text x="69" y="198.5" text-anchor="middle" fill="#111" font-size="11.5" font-weight="600">All</text>
    <text x="131" y="198.5" text-anchor="middle" fill="#71717a" font-size="11.5" font-weight="400">To do</text>
    <text x="203" y="198.5" text-anchor="middle" fill="#71717a" font-size="11.5" font-weight="400">In progress</text>
    <text x="277" y="198.5" text-anchor="middle" fill="#71717a" font-size="11.5" font-weight="400">Done</text>

