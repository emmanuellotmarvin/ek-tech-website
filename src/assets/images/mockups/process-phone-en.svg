<svg width="351" height="722" viewBox="0 0 351 722" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- EK Tech example: the plan of an app project as a task list (fictional data) -->
  <defs>
    <clipPath id="screen"><rect x="16" y="16" width="319" height="690" rx="38"/></clipPath>
    <filter id="tab-shadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="3" y="3" width="345" height="716" rx="50" stroke="white" stroke-opacity="0.1" stroke-width="6"/>
  <rect x="6" y="6" width="339" height="710" rx="47" fill="#0f1115"/>
  <rect x="6.5" y="6.5" width="338" height="709" rx="46.5" stroke="white" stroke-opacity="0.18"/>

  <g clip-path="url(#screen)">
    <rect x="16" y="16" width="319" height="690" fill="white"/>

