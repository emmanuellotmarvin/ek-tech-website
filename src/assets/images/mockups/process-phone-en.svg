    <rect x="36.5" y="372.5" width="278" height="61" rx="14" fill="white" stroke="#ececee"/>
    <circle cx="62" cy="403" r="10" stroke="#a1a1aa" stroke-width="1.8"/>
    <text x="86" y="399" fill="#111" font-size="13.5">Screen design</text>
    <circle cx="91" cy="416" r="5" stroke="#71717a" stroke-width="1.3"/>
    <path d="M91 413.5v2.8l1.8 1.2" stroke="#71717a" stroke-width="1.3" stroke-linecap="round"/>
    <text x="102" y="420" fill="#71717a" font-size="11">Weeks 2-3</text>
    <path d="M286 394v19M286 395h13l-3.5 5 3.5 5h-13" stroke="#a1a1aa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="36.5" y="444.5" width="278" height="61" rx="14" fill="white" stroke="#ececee"/>
    <circle cx="62" cy="475" r="10" stroke="#a1a1aa" stroke-width="1.8"/>
    <text x="86" y="471" fill="#111" font-size="13.5">Development</text>
    <circle cx="91" cy="488" r="5" stroke="#71717a" stroke-width="1.3"/>
    <path d="M91 485.5v2.8l1.8 1.2" stroke="#71717a" stroke-width="1.3" stroke-linecap="round"/>
    <text x="102" y="492" fill="#71717a" font-size="11">Weeks 4-7</text>
    <path d="M286 466v19M286 467h13l-3.5 5 3.5 5h-13" stroke="#a1a1aa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="36.5" y="516.5" width="278" height="61" rx="14" fill="white" stroke="#ececee"/>
