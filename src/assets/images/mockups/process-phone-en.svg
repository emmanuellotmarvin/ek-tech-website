    <rect x="36" y="588" width="279" height="50" rx="14" fill="#f4f4f5"/>
    <path d="M62 606v14M55 613h14" stroke="#71717a" stroke-width="1.8" stroke-linecap="round"/>
    <text x="86" y="617.5" fill="#71717a" font-size="12.5">Add a step…</text>
